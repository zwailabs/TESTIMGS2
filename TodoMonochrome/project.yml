name: TodoMonochrome
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    # Avoid build failures from missing icon PNGs; Sideloadly installation is fine with a generic icon.
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  TodoMonochrome:
    type: application
    platform: iOS
    entitlements:
      path: TodoMonochrome.entitlements
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Resources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TodoMonochrome
schemes:
  TodoMonochrome:
    build:
      targets:
        TodoMonochrome: all
        # Widget extension intentionally disabled for easier sideloading.
